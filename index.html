<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آزمون قطعه‌شناسی موبایل</title>
<style>
:root{--bg:#0a0f1f;--card:#121a33;--txt:#e8f0ff;--pri:#39ff88;--ac:#00d4ff;--line:#26335e;--code:#060a15;--mut:#8ea0cf;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef3ff;--card:#fff;--txt:#14204a;--pri:#0a9d4f;--line:#c9d5f5;--code:#101b3d;--mut:#51608f}}
:root[data-theme="light"]{--bg:#eef3ff;--card:#fff;--txt:#14204a;--pri:#0a9d4f;--line:#c9d5f5;--code:#101b3d;--mut:#51608f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Tahoma,"Segoe UI",Arial,sans-serif;min-height:100%;overflow-x:hidden;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:34px 34px;background-attachment:fixed}
main{max-width:600px;margin:0 auto;padding:14px}
.hud{display:flex;justify-content:space-between;gap:6px;font-weight:bold;font-size:15px;flex-wrap:wrap}
.chip{background:var(--card);border:2px solid var(--ac);border-radius:14px;padding:5px 11px;box-shadow:0 0 12px color-mix(in srgb,var(--ac) 40%,transparent)}
.path{display:flex;gap:3px;margin:12px 0 8px}
.path i{flex:1;height:10px;border-radius:6px;background:var(--line)}
.path i.on{background:var(--pri)}.path i.no{background:#ff5470}.path i.cur{background:var(--ac);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scaleY(1.8)}}
.tm{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.tm b{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--pri),#ffd23f,#ff5470)}
.card{background:var(--card);border:2px solid var(--ac);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:0 0 22px color-mix(in srgb,var(--ac) 35%,transparent);animation:pop .35s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.tag{display:inline-block;background:var(--ac);color:#04101f;font-weight:bold;font-size:13px;border-radius:10px;padding:2px 10px;margin-bottom:8px}
.q{font-size:19px;line-height:1.9;font-weight:bold}
pre{direction:ltr;text-align:left;background:var(--code);color:#9dffc4;border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;font:15px/1.7 Consolas,"Courier New",monospace;overflow-x:auto;white-space:pre}
button,input{font:inherit}
.opt{display:block;width:100%;text-align:start;background:var(--card);color:var(--txt);border:2px solid var(--line);border-radius:14px;padding:12px 14px;margin:9px 0;font-size:17px;font-weight:bold;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateX(-4px)}
.opt span{display:block;unicode-bidi:plaintext}
.opt:disabled{cursor:default;opacity:.55}.opt.ok{opacity:1;border-color:var(--pri);background:color-mix(in srgb,var(--pri) 22%,var(--card))}.opt.bad{opacity:1;border-color:#ff5470;background:color-mix(in srgb,#ff5470 22%,var(--card))}.opt.gone{visibility:hidden}
.go{width:100%;background:var(--pri);color:#04140a;border:0;border-radius:16px;padding:14px;font-size:19px;font-weight:bold;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.go.alt{background:var(--ac)}
.ll{display:flex;gap:8px;margin-bottom:10px}
.ll button{flex:1;background:var(--card);color:var(--txt);border:2px dashed var(--ac);border-radius:12px;padding:8px;font-weight:bold;cursor:pointer}
.ll button:disabled{opacity:.4;cursor:default}
input{width:100%;padding:13px;border-radius:12px;border:2px solid var(--line);background:var(--code);color:#fff;font-size:18px;margin:12px 0}
.fb{margin-top:10px;line-height:1.9;font-weight:bold}
textarea{width:100%;height:90px;border-radius:12px;border:2px dashed var(--pri);background:var(--code);color:#9dffc4;padding:10px;font:inherit;font-size:15px}
.hide{display:none}
h1{font-size:30px;text-align:center;margin:4px 0;color:var(--pri);text-shadow:0 0 14px var(--pri)}
.big{font-size:80px;text-align:center}.snake{font-size:64px;text-align:center;animation:bob 1.2s infinite alternate}
@keyframes bob{to{transform:translateY(-10px) rotate(8deg)}}
.fx{position:fixed;top:-40px;font-size:26px;pointer-events:none;z-index:9;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.gr{text-align:center;margin:10px 0}.gr svg{width:190px;max-width:65%;height:auto;background:#1b6b4a;border-radius:14px;padding:8px;border:2px solid var(--line)}
</style>
</head>
<body>
<main id="app"></main>
<script>
var EX,Q=[];
function m(t,q,o,e,c,g){return{t:t,q:q,o:o,a:0,e:e,c:c,g:g}}
var T1='قطعه‌شناسی',T2='شماتیک',T3='عیب‌یابی';
var EXAMS=[
{n:'آزمون ۱ | قطعه‌شناسی مقدماتی 🔩',q:[
m(T1,'واحد اندازه‌گیری مقاومت کدام است؟ 🔌',['اهم (Ω)','فاراد (F)','هانری (H)','آمپر (A)'],'مقاومت را با اهم می‌سنجند.'),
m(T1,'ظرفیت خازن با کدام واحد بیان می‌شود؟',['فاراد (µF / nF / pF)','اهم','ولت','وات'],'ظرفیت خازن با فاراد و زیرمجموعه‌هایش بیان می‌شود.'),
m(T1,'در شماتیک حرف L معمولاً نشان‌دهنده‌ی چیست؟',['سلف (Inductor)','مقاومت','خازن','فیوز'],'L یعنی سلف و واحدش هانری است.'),
m(T1,'دیود جریان را در چند جهت عبور می‌دهد؟',['فقط یک جهت','هر دو جهت','هیچ جهت','بستگی به رنگش دارد'],'دیود جریان را از آند به کاتد عبور می‌دهد.'),
m(T1,'پایه‌های ماسفت (MOSFET) کدامند؟',['Gate، Drain، Source','Base، Collector، Emitter','Anode، Cathode، Gate','Input، Output، Ground'],'ماسفت: گیت، درین و سورس.'),
m(T1,'پایه‌های ترانزیستور BJT کدامند؟',['Base، Collector، Emitter','Gate، Drain، Source','Vcc، Vss، Out','Tx، Rx، Clk'],'BJT: بیس، کلکتور و امیتر.'),
m(T1,'خازن سرامیکی SMD معمولی قطبیت دارد؟',['نه، دو پایه‌اش یکسان است','بله، مثبت و منفی دارد','فقط وقتی قهوه‌ای باشد','فقط در گوشی‌های قدیمی'],'سرامیکی‌ها بی‌قطبیت‌اند؛ تانتالیوم و الکترولیتی قطبیت دارند.'),
m(T1,'نوار روی بدنه‌ی خازن تانتالیوم SMD نشان‌دهنده‌ی کدام پایه است؟',['پایه‌ی مثبت','پایه‌ی منفی','ظرفیت','ولتاژ'],'در تانتالیوم نوار کنار پایه‌ی مثبت است (برعکس دیود).'),
m(T1,'کریستال (X) در برد گوشی چه می‌کند؟ ⏱️',['فرکانس کلاک دقیق تولید می‌کند','ولتاژ را تثبیت می‌کند','باتری را شارژ می‌کند','صدا را تقویت می‌کند'],'کریستال کلاک پایدار برای آی‌سی‌ها می‌سازد.'),
m(T1,'فیوز (F) چه وظیفه‌ای دارد؟',['با جریان بیش از حد مسیر را قطع می‌کند','انرژی ذخیره می‌کند','کلاک می‌سازد','ولتاژ را بالا می‌برد'],'فیوز از مدار در برابر جریان زیاد محافظت می‌کند.'),
m(T1,'مقاومت SMD با کد 103 چند اهم است؟',['10 کیلو اهم','103 اهم','1 کیلو اهم','100 کیلو اهم'],'10 و سه صفر = 10000 اهم.'),
m(T1,'کد 102 روی مقاومت SMD یعنی؟',['1 کیلو اهم','10 کیلو اهم','102 اهم','100 اهم'],'10 و دو صفر = 1000 اهم.'),
m(T1,'مقاومت SMD با کد 000 چیست؟',['مقاومت صفر اهم (جامپر)','مقاومت بی‌نهایت','خازن','قطعه‌ی خراب'],'کد 000 یعنی جامپر با مقاومت تقریباً صفر.'),
m(T1,'آی‌سی پاور (PMIC) چه می‌کند؟ ⚡',['ولتاژهای مورد نیاز بخش‌ها را تولید و مدیریت می‌کند','فقط صدا پخش می‌کند','تصویر نمایش می‌دهد','سیگنال آنتن می‌گیرد'],'PMIC ریل‌های تغذیه‌ی گوشی را می‌سازد.'),
m(T1,'آی‌سی شارژ چه وظیفه‌ای دارد؟ 🔋',['کنترل ورود جریان و شارژ باتری','ذخیره‌ی عکس‌ها','پردازش بازی','تولید کلاک'],'آی‌سی شارژ شارژ باتری را کنترل می‌کند.'),
m(T1,'eMMC یا UFS چیست؟',['حافظه‌ی داخلی ذخیره‌سازی','پردازنده','آی‌سی شارژ','آی‌سی صدا'],'اطلاعات و سیستم‌عامل در آن ذخیره می‌شود.'),
m(T1,'SoC یا CPU چیست؟ 🧠',['مغز پردازشی گوشی','باتری','میکروفون','آنتن'],'SoC پردازنده و چند بخش دیگر را در یک چیپ دارد.'),
m(T1,'دیود TVS یا ESD روی خطوط ورودی چه می‌کند؟',['از پالس و ولتاژ ناگهانی محافظت می‌کند','سیگنال را تقویت می‌کند','داده ذخیره می‌کند','کلاک می‌سازد'],'TVS پالس‌های خطرناک را به زمین می‌فرستد.'),
m(T1,'LED چگونه کار می‌کند؟ 💡',['با عبور جریان از آند به کاتد نور می‌دهد','با نور جریان ذخیره می‌کند','ولتاژ را دو برابر می‌کند','فرکانس تولید می‌کند'],'LED یک دیود نورانی است.'),
m(T1,'سلف‌ها در بخش تغذیه معمولاً کنار کدام قطعه دیده می‌شوند؟',['PMIC و آی‌سی‌های تغذیه','حافظه‌ی eMMC','دوربین','سنسور نور'],'سلف همراه آی‌سی تغذیه مبدل‌های باک و بوست را می‌سازد.')]},
{n:'آزمون ۲ | شماتیک و نقشه‌خوانی 📐',q:[
m(T2,'شماتیک چیست؟',['نقشه‌ی اتصالات الکتریکی قطعات','عکس واقعی برد','لیست قیمت قطعات','نقشه‌ی بدنه‌ی گوشی'],'شماتیک نشان می‌دهد قطعات چگونه به هم وصل‌اند.'),
m(T2,'بردویو (Boardview) چه چیزی نشان می‌دهد؟',['محل فیزیکی قطعات و نت‌ها روی برد','فقط رنگ برد','قیمت قطعات','وضعیت باتری'],'بردویو جای دقیق قطعات را روی برد نشان می‌دهد.'),
m(T2,'GND یعنی؟',['زمین؛ مرجع صفر ولت','ورودی شارژ','خروجی صدا','کلاک'],'GND مرجع ولتاژ در برد است.'),
m(T2,'VBAT معمولاً چه ولتاژی دارد؟ 🔋',['ولتاژ باتری، حدود ۳ تا ۴.۴ ولت','۱۲۰ ولت','صفر ولت','۴۰ ولت'],'باتری لیتیومی گوشی تقریباً ۳ تا ۴.۴ ولت دارد.'),
m(T2,'برچسب U2000 روی برد معمولاً چیست؟',['آی‌سی','مقاومت','خازن','فیوز'],'U حرف اول Unit و نشانه‌ی آی‌سی است.'),
m(T2,'حرف Q در شماتیک معمولاً چیست؟',['ترانزیستور یا ماسفت','سلف','کریستال','کانکتور'],'Q برای ترانزیستورها به کار می‌رود.'),
m(T2,'TP در شماتیک یعنی؟',['Test Point؛ نقطه‌ی تست','Top Power','Time Pulse','Touch Panel'],'TP نقطه‌ای برای اندازه‌گیری است.'),
m(T2,'NC کنار یک پایه یعنی؟',['No Connect؛ به جایی وصل نیست','Normal Current','New Circuit','Negative Charge'],'پایه‌ی NC استفاده نشده است.'),
m(T2,'دو نت با نام یکسان در دو صفحه‌ی شماتیک، بدون سیم بین‌شان چه وضعی دارند؟',['به هم وصل‌اند','جدا هستند','فقط هنگام روشن بودن وصل‌اند','اتصال کوتاه هستند'],'نام نت یکسان یعنی اتصال الکتریکی یکسان.'),
m(T2,'سیگنالی مثل RESET_N با پسوند N یعنی؟',['Active Low؛ با صفر ولت فعال می‌شود','با ولتاژ بالا فعال می‌شود','همیشه خاموش است','سیم ندارد'],'N یا خط بالای نام یعنی فعال در سطح پایین.'),
m(T2,'خطوط I2C کدامند؟',['SDA و SCL','TX و RX','D+ و D-','VCC و GND'],'I2C دو خط داده و کلاک دارد.'),
m(T2,'خطوط UART کدامند؟',['TX و RX','SDA و SCL','D+ و D-','EN و NC'],'UART با ارسال و دریافت کار می‌کند.'),
m(T2,'پایه‌ی EN یا Enable چه می‌کند؟',['با سیگنال آن، آی‌سی یا بلوک فعال می‌شود','ولتاژ ورودی است','به زمین وصل می‌شود','فقط برای تست است'],'EN فرمان روشن شدن بلوک را می‌دهد.'),
m(T2,'مقاومت پول‌آپ (Pull-up) چه می‌کند؟',['سیگنال را به ولتاژ بالا وصل نگه می‌دارد','سیگنال را به زمین می‌برد','کلاک می‌سازد','جریان را قطع می‌کند'],'پول‌آپ حالت پیش‌فرض خط را High می‌کند.'),
m(T2,'ولتاژ VOUT در این مدار چقدر است؟ 🧮',['1.8V','3.6V','0V','7.2V'],'دو مقاومت برابر ولتاژ را نصف می‌کنند.','VIN = 3.6V\n  |\n[R1 10k]\n  |----> VOUT\n[R2 10k]\n  |\n GND'),
m(T2,'مقاومت معادل بین A و B چند است؟',['3k','2k','0.67k','1k'],'در حالت سری مقاومت‌ها جمع می‌شوند: 1k + 2k = 3k.','A --[R1 1k]--[R2 2k]-- B'),
m(T2,'مقاومت معادل بین A و B چند است؟',['5k','20k','10k','0'],'دو مقاومت برابر موازی، نصف می‌شوند.','   +-[R1 10k]-+\nA -+           +- B\n   +-[R2 10k]-+'),
m(T2,'جریان عادی از کدام سمت دیود می‌گذرد؟',['از A (آند) به K (کاتد)','از K به A','از هر دو طرف','از هیچ طرف'],'پیکان نماد دیود جهت عبور جریان را نشان می‌دهد.','A ---|>|--- K'),
m(T2,'کانکتورهای J، CN و BTB در شماتیک چه کاری دارند؟',['اتصال قطعات خارجی مثل LCD، باتری و فلت','پردازش داده','فیلتر کردن ولتاژ','تولید کلاک'],'کانکتور برد را به قطعات دیگر وصل می‌کند.'),
m(T2,'ترتیب منطقی روشن شدن گوشی کدام است? 🚀',['باتری ← PMIC ← ولتاژهای تغذیه ← CPU','CPU ← باتری ← PMIC','LCD ← CPU ← باتری','صدا ← شارژ ← باتری'],'اول تغذیه‌ها ساخته می‌شوند و بعد CPU بوت می‌شود.')]},
{n:'آزمون ۳ | ابزار و عیب‌یابی 🛠️',q:[
m(T3,'حالت دیود مولتی‌متر برای چیست؟',['تست دیود و بررسی اتصال کوتاه روی خطوط','اندازه‌گیری دما','اندازه‌گیری فرکانس شبکه','تست باتری'],'حالت دیود افت ولتاژ را می‌سنجد و برای تست خطوط مفید است.'),
m(T3,'حالت بیپ (Continuity) چه چیزی را نشان می‌دهد؟',['وجود اتصال بین دو نقطه','ولتاژ باتری','ظرفیت خازن','دمای قطعه'],'بیپ یعنی دو نقطه اتصال دارند.'),
m(T3,'منبع تغذیه‌ی DC (Power Supply) در تعمیرات چه کاربردی دارد؟',['تأمین ولتاژ و دیدن مصرف جریان برد','تمیز کردن برد','لحیم کردن','باز کردن قاب'],'با آن مصرف جریان گوشی را زیر نظر می‌گیریم.'),
m(T3,'گوشی روی منبع تغذیه جریان زیاد می‌کشد ولی روشن نمی‌شود؛ احتمال چیست؟',['اتصال کوتاه روی یکی از خطوط','باتری پر است','اپ خراب است','قاب شل است'],'جریان بالا معمولاً نشانه‌ی اتصال کوتاه است.'),
m(T3,'اولین کار قبل از هر تعمیر روی برد؟ 🔋',['جدا کردن باتری','وصل کردن شارژر','فشردن دکمه‌ی روشن','ریختن فلاکس'],'اول باتری را جدا می‌کنیم تا برد برق نداشته باشد.'),
m(T3,'فلاکس چه کاری می‌کند؟',['کمک به جاری شدن لحیم و پاک کردن اکسید','برد را سرد می‌کند','ولتاژ تولید می‌کند','برد را رنگ می‌کند'],'فلاکس لحیم‌کاری را تمیزتر و ساده‌تر می‌کند.'),
m(T3,'هیترِ خیلی داغ و باد خیلی زیاد چه خطری دارد؟ 🔥',['جابه‌جا یا سوختن قطعات اطراف','هیچ خطری ندارد','برد سریع‌تر خنک می‌شود','لحیم قوی‌تر می‌شود'],'برای قطعات ریز باید دما و باد را مناسب انتخاب کرد.'),
m(T3,'برای جلوگیری از ESD هنگام کار با برد چه باید کرد؟',['استفاده از مچ‌بند آنتی‌استاتیک','کار روی فرش','پوشیدن لباس پشمی','کار روی پلاستیک'],'تخلیه‌ی الکتریسیته‌ی ساکن می‌تواند آی‌سی‌ها را خراب کند.'),
